name: Release

# Publica una versión de dos formas:
#   - git tag v0.1.0 && git push origin v0.1.0
#   - Actions → Release → Run workflow (crea la etiqueta con la versión indicada)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar (ej. v0.1.0)'
        required: true
        default: 'v0.1.2'
      publish:
        description: 'Publicar la release (desmarca para solo compilar y probar)'
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Paquetes ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Herramientas de empaquetado (rpmbuild, bsdtar)
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - name: fpm del sistema (el binario incluido en electron-builder es solo x86_64)
        if: matrix.arch == 'arm64'
        run: sudo apt-get install -y ruby ruby-dev build-essential && sudo gem install fpm --no-document
      - run: npm ci
      - run: npm run build
      - name: AppImage, deb, rpm, pacman y tar.gz
        run: npx electron-builder --linux AppImage deb rpm pacman tar.gz --${{ matrix.arch }} --publish never
        env:
          USE_SYSTEM_FPM: ${{ matrix.arch == 'arm64' && 'true' || '' }}
      - uses: actions/upload-artifact@v5
        with:
          name: islet-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.pacman
            release/*.tar.gz

  test:
    name: Pruebas de instalación
    needs: build
    uses: ./.github/workflows/install-tests.yml
    with:
      source: local

  release:
    name: Publicar release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: dist-all
          pattern: islet-*
          merge-multiple: true
      - name: Checksums
        run: cd dist-all && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist-all/*
            install.sh

  verify:
    name: Verificar release publicada
    needs: release
    uses: ./.github/workflows/install-tests.yml
    with:
      source: release
