name: Release

# Publica una versión de dos formas:
#   - git tag v0.2.0 && git push origin v0.2.0
#   - Actions → Release → Run workflow (crea la etiqueta con la versión indicada)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar (ej. v0.2.0)'
        required: true
        default: 'v0.2.0'
      publish:
        description: 'Publicar la release (desmarca para solo compilar y probar)'
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Paquetes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Herramientas (fpm, rpmbuild, bsdtar)
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm libarchive-tools zstd
          sudo gem install fpm --no-document
      - run: bash packaging/build.sh
      - uses: actions/upload-artifact@v5
        with:
          name: islet-paquetes
          if-no-files-found: error
          path: dist/*

  test:
    name: Pruebas de instalación
    needs: build
    uses: ./.github/workflows/install-tests.yml
    with:
      source: local

  release:
    name: Publicar release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: dist-all
          pattern: islet-paquetes
          merge-multiple: true
      - name: Checksums
        run: cd dist-all && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist-all/*
            install.sh

  verify:
    name: Verificar release publicada
    needs: release
    uses: ./.github/workflows/install-tests.yml
    with:
      source: release
