name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Dependencias (Python + GTK 3 del sistema)
        run: sudo apt-get update && sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 dbus pyflakes3
      - name: Lint
        run: pyflakes3 islet tools tests/*.py && python3 -m py_compile islet/*.py
      - name: Prueba MPRIS con reproductor falso
        run: dbus-run-session -- python3 tests/test_mpris.py
      - name: Paquete .deb
        run: bash packaging/build.sh && dpkg-deb -I dist/*.deb
