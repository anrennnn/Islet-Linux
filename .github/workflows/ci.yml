name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prueba MPRIS con reproductor falso
        run: |
          sudo apt-get update && sudo apt-get install -y dbus
          dbus-run-session -- bash -c 'node tools/fake-player.cjs & sleep 1 && node tools/test-mpris.cjs'
      - name: Prueba MPRIS con bus D-Bus "abstract" (Ubuntu 22.04 y sesiones sin systemd)
        run: |
          export DBUS_SESSION_BUS_ADDRESS=$(dbus-daemon --config-file=tests/abstract-bus.conf --fork --print-address | head -1)
          node tools/fake-player.cjs & sleep 1 && node tools/test-mpris.cjs
